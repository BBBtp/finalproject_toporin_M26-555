[project]
name = "finalproject-toporin-m26-555"
version = "1.0.0"
description = "Educational virtual currency trading CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "prettytable>=3.12,<4",
  "requests>=2.32,<3",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 300
base_currency = "USD"
log_file = "data/app.log"
log_level = "INFO"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
